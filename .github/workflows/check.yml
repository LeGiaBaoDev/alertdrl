name: AlertDRL check

on:
  schedule:
    # Mỗi 15 phút khởi động một job mới. Mỗi job chạy VÒNG LẶP quét ~mỗi 1 phút
    # trong ~15 phút rồi thoát, job kế tiếp nối đuôi -> gần như quét 1 phút/lần 24/7.
    # (GitHub cron tối thiểu 5 phút nên không thể đặt 1 phút trực tiếp; vòng lặp trong job
    #  là cách để đạt ~1 phút/lần. Chỉ MIỄN PHÍ nếu repo PUBLIC.)
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # cho phép bấm "Run workflow" thủ công để test

permissions:
  contents: write # để đẩy events.json lên nhánh "data" cho app đọc

concurrency:
  # Không huỷ job đang chạy: job mới xếp hàng, chạy ngay khi job cũ xong -> liên tục.
  group: alertdrl-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: backend
        run: npm ci

      # Khôi phục trạng thái (events.json + cookie.txt) từ lần chạy trước
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: backend/data
          key: alertdrl-state-${{ github.run_id }}
          restore-keys: |
            alertdrl-state-

      - name: Run scraper loop (~1 phút/lần trong ~15 phút)
        working-directory: backend
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          COOKIE: ${{ secrets.COOKIE }}
          NTFY_ENABLED: 'true'
          NTFY_SERVER: 'https://ntfy.sh'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EXPO_ENABLED: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Đẩy events.json lên nhánh "data" để app đọc qua URL raw.githubusercontent.
          # Clone riêng để KHÔNG đụng working tree chính (giữ nguyên cache cookie).
          publish() {
            [ -f data/events.json ] || return 0
            cp data/events.json "$RUNNER_TEMP/events.json"
            local DIR="$RUNNER_TEMP/pub"; rm -rf "$DIR"
            local REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if ! git clone --depth=1 --branch data "$REMOTE" "$DIR" 2>/dev/null; then
              git clone --depth=1 "$REMOTE" "$DIR"
              ( cd "$DIR" && git checkout --orphan data && git rm -rf . >/dev/null 2>&1 || true )
            fi
            cp "$RUNNER_TEMP/events.json" "$DIR/events.json"
            ( cd "$DIR"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add events.json
              if git diff --cached --quiet; then
                echo "events không đổi — bỏ qua"
              else
                git commit -m "data: cập nhật events [skip ci]" && git push origin data
              fi )
          }

          # Lặp ~14 phút (chừa ~1 phút để job tiếp theo đã xếp hàng nối liền, tránh chồng).
          END=$((SECONDS + 840))
          first=1
          while [ "$SECONDS" -lt "$END" ]; do
            node src/index.js --once || true
            # Publish ngay sau lần quét đầu để app có danh sách sớm (~1 phút)
            if [ "$first" = 1 ]; then publish; first=0; fi
            [ "$SECONDS" -lt "$END" ] && sleep 60
          done
          publish # publish lần cuối trước khi job kết thúc
